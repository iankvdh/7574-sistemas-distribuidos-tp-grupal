services:
  client_0:
    build: { context: ./src/, dockerfile: client/Dockerfile }
    depends_on:
      rabbitmq: { condition: service_healthy }
      gateway_1: { condition: service_started }
      gateway_2: { condition: service_started }
      filter_period1_0: { condition: service_started }
      filter_period1_1: { condition: service_started }
      filter_period1_2: { condition: service_started }
      filter_currency_usd_p1_0: { condition: service_started }
      filter_currency_usd_p1_1: { condition: service_started }
      filter_currency_usd_p1_2: { condition: service_started }
      sharder_q4: { condition: service_started }
      suspicious_account_filter_0: { condition: service_started }
      suspicious_account_filter_1: { condition: service_started }
      suspicious_account_filter_2: { condition: service_started }
      path_finder_q4_0: { condition: service_started }
      path_finder_q4_1: { condition: service_started }
      path_finder_q4_2: { condition: service_started }
      counter_q4_0: { condition: service_started }
      counter_q4_1: { condition: service_started }
      counter_q4_2: { condition: service_started }
      final_joiner_0: { condition: service_started }
      final_joiner_1: { condition: service_started }
    env_file:
      - .env
    environment:
      - INPUT_TRANSACTIONS=/datasets/LI-Small_Trans.csv
      - INPUT_ACCOUNTS=/datasets/LI-Small_accounts.csv
      - GATEWAY_PREFIX=gateway_
      - GATEWAY_AMOUNT=2
      - GATEWAY_PORT=5678
      - CONNECT_MAX_ATTEMPTS=6
      - CONNECT_TIMEOUT_MS=800
      - BACKOFF_BASE_MS=200
      - BACKOFF_MAX_MS=3000
      - RESULTS_DIR=/results
      - EXPECTED_QUERY_EOFS=1
      - LOG_LEVEL=info
    volumes:
      - ./datasets:/datasets
      - ./results/client_0:/results
  client_1:
    build: { context: ./src/, dockerfile: client/Dockerfile }
    depends_on:
      rabbitmq: { condition: service_healthy }
      gateway_1: { condition: service_started }
      gateway_2: { condition: service_started }
      filter_period1_0: { condition: service_started }
      filter_period1_1: { condition: service_started }
      filter_period1_2: { condition: service_started }
      filter_currency_usd_p1_0: { condition: service_started }
      filter_currency_usd_p1_1: { condition: service_started }
      filter_currency_usd_p1_2: { condition: service_started }
      sharder_q4: { condition: service_started }
      suspicious_account_filter_0: { condition: service_started }
      suspicious_account_filter_1: { condition: service_started }
      suspicious_account_filter_2: { condition: service_started }
      path_finder_q4_0: { condition: service_started }
      path_finder_q4_1: { condition: service_started }
      path_finder_q4_2: { condition: service_started }
      counter_q4_0: { condition: service_started }
      counter_q4_1: { condition: service_started }
      counter_q4_2: { condition: service_started }
      final_joiner_0: { condition: service_started }
      final_joiner_1: { condition: service_started }
    env_file:
      - .env
    environment:
      - INPUT_TRANSACTIONS=/datasets/LI-Small_Trans.csv
      - INPUT_ACCOUNTS=/datasets/LI-Small_accounts.csv
      - GATEWAY_PREFIX=gateway_
      - GATEWAY_AMOUNT=2
      - GATEWAY_PORT=5678
      - CONNECT_MAX_ATTEMPTS=6
      - CONNECT_TIMEOUT_MS=800
      - BACKOFF_BASE_MS=200
      - BACKOFF_MAX_MS=3000
      - RESULTS_DIR=/results
      - EXPECTED_QUERY_EOFS=1
      - LOG_LEVEL=info
    volumes:
      - ./datasets:/datasets
      - ./results/client_1:/results
  gateway_1:
    build: { context: ./src/, dockerfile: gateway/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - ALL_TRANSACTIONS_QUEUE=all_transactions
      - ALL_ACCOUNTS_QUEUE=all_accounts
      - FINAL_QUEUE=final
      - GATEWAY_ID=1
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=5678
      - EXPECTED_QUERY_EOFS=1
      - LOG_LEVEL=info
  gateway_2:
    build: { context: ./src/, dockerfile: gateway/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - ALL_TRANSACTIONS_QUEUE=all_transactions
      - ALL_ACCOUNTS_QUEUE=all_accounts
      - FINAL_QUEUE=final
      - GATEWAY_ID=2
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=5678
      - EXPECTED_QUERY_EOFS=1
      - LOG_LEVEL=info
  filter_period1_0:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=filter_period1
      - REPLICA_ID=0
      - N_REPLICAS=3
      - INPUT=queue:all_transactions
      - OUTPUTS_MATCH_COUNT=1
      - OUTPUT_0=queue:period1_for_currency_usd_p1
      - OUTPUT_1=queue:non_period1_transactions
      - LOG_LEVEL=info
      - RING_QUEUE_IN=ring_filter_period1_0
      - RING_QUEUE_OUT=ring_filter_period1_1
  filter_period1_1:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=filter_period1
      - REPLICA_ID=1
      - N_REPLICAS=3
      - INPUT=queue:all_transactions
      - OUTPUTS_MATCH_COUNT=1
      - OUTPUT_0=queue:period1_for_currency_usd_p1
      - OUTPUT_1=queue:non_period1_transactions
      - LOG_LEVEL=info
      - RING_QUEUE_IN=ring_filter_period1_1
      - RING_QUEUE_OUT=ring_filter_period1_2
  filter_period1_2:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=filter_period1
      - REPLICA_ID=2
      - N_REPLICAS=3
      - INPUT=queue:all_transactions
      - OUTPUTS_MATCH_COUNT=1
      - OUTPUT_0=queue:period1_for_currency_usd_p1
      - OUTPUT_1=queue:non_period1_transactions
      - LOG_LEVEL=info
      - RING_QUEUE_IN=ring_filter_period1_2
      - RING_QUEUE_OUT=ring_filter_period1_0
  filter_currency_usd_p1_0:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=filter_currency_usd_p1
      - REPLICA_ID=0
      - N_REPLICAS=3
      - INPUT=queue:period1_for_currency_usd_p1
      - OUTPUTS_MATCH_COUNT=1
      - OUTPUT_0=queue:period1_usd_for_drain
      - LOG_LEVEL=info
      - RING_QUEUE_IN=ring_filter_currency_usd_p1_0
      - RING_QUEUE_OUT=ring_filter_currency_usd_p1_1
  filter_currency_usd_p1_1:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=filter_currency_usd_p1
      - REPLICA_ID=1
      - N_REPLICAS=3
      - INPUT=queue:period1_for_currency_usd_p1
      - OUTPUTS_MATCH_COUNT=1
      - OUTPUT_0=queue:period1_usd_for_drain
      - LOG_LEVEL=info
      - RING_QUEUE_IN=ring_filter_currency_usd_p1_1
      - RING_QUEUE_OUT=ring_filter_currency_usd_p1_2
  filter_currency_usd_p1_2:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=filter_currency_usd_p1
      - REPLICA_ID=2
      - N_REPLICAS=3
      - INPUT=queue:period1_for_currency_usd_p1
      - OUTPUTS_MATCH_COUNT=1
      - OUTPUT_0=queue:period1_usd_for_drain
      - LOG_LEVEL=info
      - RING_QUEUE_IN=ring_filter_currency_usd_p1_2
      - RING_QUEUE_OUT=ring_filter_currency_usd_p1_0
  sharder_q4:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=sharder_q4
      - REPLICA_ID=0
      - N_REPLICAS=1
      - INPUT=queue:period1_usd_for_drain
      - OUTPUTS_MATCH_COUNT=0
      - OUTPUT_0=direct_exchange:q4_account_shards
      - LOG_LEVEL=info
      - K_SUSPICIOUS_FILTERS=3
  suspicious_account_filter_0:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=suspicious_account_filter
      - REPLICA_ID=0
      - N_REPLICAS=3
      - INPUT=direct_exchange:q4_account_shards:0
      - OUTPUTS_MATCH_COUNT=0
      - OUTPUT_0=direct_exchange:q4_suspicious_account_shards
      - LOG_LEVEL=info
      - K_PATH_FINDERS=3
      - N_SHARDERS=1
      - SUSPICIOUS_THRESHOLD=5
  suspicious_account_filter_1:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=suspicious_account_filter
      - REPLICA_ID=1
      - N_REPLICAS=3
      - INPUT=direct_exchange:q4_account_shards:1
      - OUTPUTS_MATCH_COUNT=0
      - OUTPUT_0=direct_exchange:q4_suspicious_account_shards
      - LOG_LEVEL=info
      - K_PATH_FINDERS=3
      - N_SHARDERS=1
      - SUSPICIOUS_THRESHOLD=5
  suspicious_account_filter_2:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=suspicious_account_filter
      - REPLICA_ID=2
      - N_REPLICAS=3
      - INPUT=direct_exchange:q4_account_shards:2
      - OUTPUTS_MATCH_COUNT=0
      - OUTPUT_0=direct_exchange:q4_suspicious_account_shards
      - LOG_LEVEL=info
      - K_PATH_FINDERS=3
      - N_SHARDERS=1
      - SUSPICIOUS_THRESHOLD=5
  path_finder_q4_0:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=path_finder_q4
      - REPLICA_ID=0
      - N_REPLICAS=3
      - INPUT=direct_exchange:q4_suspicious_account_shards:0
      - OUTPUTS_MATCH_COUNT=0
      - OUTPUT_0=direct_exchange:q4_pair_shards
      - LOG_LEVEL=info
      - K_COUNTERS=3
      - N_SUSPICIOUS_FILTERS=3
  path_finder_q4_1:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=path_finder_q4
      - REPLICA_ID=1
      - N_REPLICAS=3
      - INPUT=direct_exchange:q4_suspicious_account_shards:1
      - OUTPUTS_MATCH_COUNT=0
      - OUTPUT_0=direct_exchange:q4_pair_shards
      - LOG_LEVEL=info
      - K_COUNTERS=3
      - N_SUSPICIOUS_FILTERS=3
  path_finder_q4_2:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=path_finder_q4
      - REPLICA_ID=2
      - N_REPLICAS=3
      - INPUT=direct_exchange:q4_suspicious_account_shards:2
      - OUTPUTS_MATCH_COUNT=0
      - OUTPUT_0=direct_exchange:q4_pair_shards
      - LOG_LEVEL=info
      - K_COUNTERS=3
      - N_SUSPICIOUS_FILTERS=3
  counter_q4_0:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=counter_q4
      - REPLICA_ID=0
      - N_REPLICAS=3
      - INPUT=direct_exchange:q4_pair_shards:0
      - OUTPUTS_MATCH_COUNT=0
      - OUTPUT_0=direct_exchange:results
      - LOG_LEVEL=info
      - MIN_INTERMEDIATES=5
      - N_FINAL_JOINERS=2
      - N_PATH_FINDERS=3
  counter_q4_1:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=counter_q4
      - REPLICA_ID=1
      - N_REPLICAS=3
      - INPUT=direct_exchange:q4_pair_shards:1
      - OUTPUTS_MATCH_COUNT=0
      - OUTPUT_0=direct_exchange:results
      - LOG_LEVEL=info
      - MIN_INTERMEDIATES=5
      - N_FINAL_JOINERS=2
      - N_PATH_FINDERS=3
  counter_q4_2:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=counter_q4
      - REPLICA_ID=2
      - N_REPLICAS=3
      - INPUT=direct_exchange:q4_pair_shards:2
      - OUTPUTS_MATCH_COUNT=0
      - OUTPUT_0=direct_exchange:results
      - LOG_LEVEL=info
      - MIN_INTERMEDIATES=5
      - N_FINAL_JOINERS=2
      - N_PATH_FINDERS=3
  final_joiner_0:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=final_joiner
      - REPLICA_ID=0
      - N_REPLICAS=2
      - INPUT=direct_exchange:results:0
      - OUTPUTS_MATCH_COUNT=0
      - OUTPUT_0=final_queue:final_1
      - OUTPUT_1=final_queue:final_2
      - LOG_LEVEL=info
      - EXPECTED_EOFS_Q4=3
  final_joiner_1:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=final_joiner
      - REPLICA_ID=1
      - N_REPLICAS=2
      - INPUT=direct_exchange:results:1
      - OUTPUTS_MATCH_COUNT=0
      - OUTPUT_0=final_queue:final_1
      - OUTPUT_1=final_queue:final_2
      - LOG_LEVEL=info
      - EXPECTED_EOFS_Q4=3
  rabbitmq:
    build: { context: ./src/rabbitmq, dockerfile: Dockerfile }
    volumes:
      - ./src/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
      - 5672:5672
      - 15672:15672
