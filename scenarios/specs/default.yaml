# Base mínima: 1 cliente, 1 gateway, 1 réplica por strategy.
# Sirve como sanity check end-to-end antes de implementar Q1..Q5.

clients: 1
gateways: 1
log_level: info
# Q1, Q2 y Q4 implementadas en la pipeline distribuida.
expected_query_eofs: 3
transactions: /datasets/LI-Small_Trans.csv
accounts: /datasets/LI-Small_accounts.csv

workers:
  - name: filter_period1
    strategy: filter_period1
    replicas: 1
    input: queue:all_transactions
    match_count: 1
    outputs:
      - direct_exchange:period1_transactions
      - queue:non_period1_transactions

  - name: filter_wire_ach
    strategy: filter_wire_ach
    replicas: 1
    input: direct_exchange:period1_transactions
    match_count: 1
    outputs:
      - queue:period1_wire_ach

  - name: filter_currency_usd_p1
    strategy: filter_currency_usd_p1
    replicas: 1
    input: direct_exchange:period1_transactions
    match_count: 2
    outputs:
      - queue:period1_usd_for_drain
      - sharded_queues:joiner_usd_input:1

  - name: filter_period2
    strategy: filter_period2
    replicas: 1
    input: queue:non_period1_transactions
    match_count: 1
    outputs:
      - queue:period2_transactions
      - queue:other_dates_transactions

  - name: filter_currency_usd_p2
    strategy: filter_currency_usd_p2
    replicas: 1
    input: queue:period2_transactions
    match_count: 2
    outputs:
      - direct_exchange:period2_usd_direct_exchange
      - sharded_queues:joiner_usd_input:1

  - name: filter_currency_usd_other_periods
    strategy: filter_currency_usd_other_periods
    replicas: 1
    input: queue:other_dates_transactions
    match_count: 1
    outputs:
      - sharded_queues:joiner_usd_input:1

  - name: joiner_usd
    strategy: joiner_usd
    replicas: 1
    input: queue:joiner_usd_input_0
    outputs:
      - direct_exchange:usd
      - queue:q2_input
    env:
      EXPECTED_EOFS: "3"

  - name: filter_amount_lt_50
    strategy: filter_amount_lt_50
    replicas: 1
    input: direct_exchange:usd
    match_count: 1
    outputs:
      - queue:q1_input

  - name: sharder_q1
    strategy: sharder_q1
    replicas: 1
    input: queue:q1_input
    outputs:
      - direct_exchange:results
    env:
      N_FINAL_JOINERS: "1"

  - name: drain_period1_wire_ach
    strategy: drain
    replicas: 1
    input: queue:period1_wire_ach
    env:
      DRAIN_OUTPUT_FILE: /results/drain_period1_wire_ach.csv
    volumes:
      - ./results:/results

  - name: sharder_q4
    strategy: sharder_q4
    replicas: 1
    input: queue:period1_usd_for_drain
    outputs:
      - direct_exchange:q4_account_shards
    env:
      K_SUSPICIOUS_FILTERS: "1"

  - name: suspicious_account_filter
    strategy: suspicious_account_filter
    replicas: 1
    input: direct_exchange:q4_account_shards:0
    outputs:
      - direct_exchange:q4_suspicious_account_shards
    env:
      N_SHARDERS: "1"
      K_PATH_FINDERS: "1"
      SUSPICIOUS_THRESHOLD: "5"

  - name: path_finder_q4
    strategy: path_finder_q4
    replicas: 1
    input: direct_exchange:q4_suspicious_account_shards:0
    outputs:
      - direct_exchange:q4_pair_shards
    env:
      K_COUNTERS: "1"
      N_SUSPICIOUS_FILTERS: "1"

  - name: counter_q4
    strategy: counter_q4
    replicas: 1
    input: direct_exchange:q4_pair_shards:0
    outputs:
      - direct_exchange:results
    env:
      N_PATH_FINDERS: "1"
      N_FINAL_JOINERS: "1"
      MIN_INTERMEDIATES: "5"

  - name: drain_period2_usd
    strategy: drain
    replicas: 1
    input: direct_exchange:period2_usd_direct_exchange
    env:
      DRAIN_OUTPUT_FILE: /results/drain_period2_usd.csv
    volumes:
      - ./results:/results

  - name: drain_usd_joined
    strategy: drain
    replicas: 1
    input: direct_exchange:usd
    env:
      DRAIN_OUTPUT_FILE: /results/drain_usd_joined.csv
    volumes:
      - ./results:/results

  - name: max_q2
    strategy: max_q2
    replicas: 1
    input: queue:q2_input
    outputs:
      - direct_exchange:q2_agg_input
    env:
      K_AGGREGATORS_Q2: "1"

  - name: bank_aggregator
    strategy: bank_aggregator
    replicas: 1
    input: queue:all_accounts
    outputs:
      - direct_exchange:q2_agg_input
    env:
      K_AGGREGATORS_Q2: "1"

  - name: aggregator_q2
    strategy: aggregator_q2
    replicas: 1
    input: direct_exchange:q2_agg_input:{REPLICA_ID}
    outputs:
      - direct_exchange:results
    env:
      EXPECTED_PARTIAL_EOFS: "2" # = N_REPLICAS de max_q2 + N_REPLICAS de bank_aggregator
      N_FINAL_JOINERS: "1"

  - name: final_joiner
    strategy: final_joiner
    replicas: 1
    input: direct_exchange:results:{REPLICA_ID}
    outputs:
      - final_queue:final_1
    env:
      EXPECTED_EOFS_Q1: "1"      # solo el initiator del ring de sharder_q1 emite EOF
      EXPECTED_EOFS_Q2: "1"      # = N_REPLICAS de aggregator_q2
      EXPECTED_EOFS_Q4: "1"      # = K_COUNTERS (replicas de counter_q4)
