# Spec de test enfocado SOLO en Q5.

clients: 2
gateways: 2
log_level: info
# Sólo Q5 está activa: el gateway y el cliente esperan UN único EOF por cliente.
expected_query_eofs: 1
transactions: /datasets/LI-Small_Trans.csv
accounts: /datasets/LI-Small_accounts.csv

fetchers:
  - name: fetcher_q5
    env:
      CONVERSIONS_QUEUE_PREFIX: conversions
      CONVERSIONS_BASE_CURRENCY: USD

workers:
  - name: filter_period1
    strategy: filter_period1
    replicas: 3
    input: queue:all_transactions
    match_count: 1
    outputs:
      - direct_exchange:period1_transactions
      - queue:non_period1_transactions_drain

  - name: filter_wire_ach
    strategy: filter_wire_ach
    replicas: 1
    input: direct_exchange:period1_transactions
    match_count: 1
    outputs:
      - queue:period1_wire_ach

  - name: micro_transaction_counter
    strategy: micro_transaction_counter
    replicas: 3
    inputs:
      - queue:conversions_{REPLICA_ID}
      - queue:period1_wire_ach
    outputs:
      - direct_exchange:partial_counts_q5
    env:
      MAX_CONVERTED_AMOUNT_USD: "1"

  - name: aggregator_q5
    strategy: aggregator_q5
    replicas: 2
    input: direct_exchange:partial_counts_q5:{REPLICA_ID}
    outputs:
      - direct_exchange:results

  - name: final_joiner
    strategy: final_joiner
    replicas: 2
    input: direct_exchange:results:{REPLICA_ID}
    outputs:
      - final_queues
