# Escenario más exigente: 2 clientes (cada uno publica el dataset completo),
# 2 gateways, y N=3 réplicas en todos los filters y en el joiner_usd (K=3).
# Mismo modelo que scaled: fan-out por queues nombradas (una por consumer-type)
# y sharding al joiner_usd vía sharded_queues:joiner_usd_input:3.

clients: 2
gateways: 2
log_level: info
# Q1, Q2, Q3 y Q4 implementadas en la pipeline distribuida; el cliente
# y el gateway cierran sesión con esos cuatro EOFs.
expected_query_eofs: 4
transactions: /datasets/LI-Small_Trans.csv
accounts: /datasets/LI-Small_accounts.csv

workers:
  - name: filter_period1
    strategy: filter_period1
    replicas: 3
    input: queue:all_transactions
    match_count: 2
    outputs:
      - queue:period1_for_wire_ach
      - queue:period1_for_currency_usd_p1
      - queue:non_period1_transactions

  - name: filter_wire_ach
    strategy: filter_wire_ach
    replicas: 3
    input: queue:period1_for_wire_ach

  - name: filter_currency_usd_p1
    strategy: filter_currency_usd_p1
    replicas: 3
    input: queue:period1_for_currency_usd_p1
    match_count: 3
    outputs:
      - queue:period1_usd_transactions
      - sharded_queues:joiner_usd_input:3
      - queue:q3_p1_usd                              # NEW: P1 USD para average_local_q3

  - name: filter_period2
    strategy: filter_period2
    replicas: 3
    input: queue:non_period1_transactions
    match_count: 1
    outputs:
      - queue:period2_transactions
      - queue:other_dates_transactions

  - name: filter_currency_usd_p2
    strategy: filter_currency_usd_p2
    replicas: 3
    input: queue:period2_transactions
    match_count: 2
    outputs:
      - sharded_queues:joiner_usd_input:3
      - queue:q3_filter_input                        # NEW: P2 USD para filter_q3

  - name: filter_currency_usd_other_periods
    strategy: filter_currency_usd_other_periods
    replicas: 3
    input: queue:other_dates_transactions
    match_count: 1
    outputs:
      - sharded_queues:joiner_usd_input:3

  - name: joiner_usd
    strategy: joiner_usd
    replicas: 3
    input: queue:joiner_usd_input_{REPLICA_ID}
    outputs:
      - queue:usd_for_amount_lt_50
      - queue:q2_input
    env:
      EXPECTED_EOFS: "3"

  - name: filter_amount_lt_50
    strategy: filter_amount_lt_50
    replicas: 3
    input: queue:usd_for_amount_lt_50
    match_count: 1
    outputs:
      - queue:q1_input

  - name: sharder_q1
    strategy: sharder_q1
    replicas: 3
    input: queue:q1_input
    outputs:
      - direct_exchange:results
    env:
      N_FINAL_JOINERS: "2"

  - name: sharder_q4
    strategy: sharder_q4
    replicas: 3
    input: queue:period1_usd_transactions
    outputs:
      - direct_exchange:q4_account_shards
    env:
      K_SUSPICIOUS_FILTERS: "3"

  - name: suspicious_account_filter
    strategy: suspicious_account_filter
    replicas: 3
    input: direct_exchange:q4_account_shards:{REPLICA_ID}
    outputs:
      - direct_exchange:q4_suspicious_account_shards
    env:
      N_SHARDERS: "3"
      K_PATH_FINDERS: "3"
      SUSPICIOUS_THRESHOLD: "5"

  - name: path_finder_q4
    strategy: path_finder_q4
    replicas: 3
    input: direct_exchange:q4_suspicious_account_shards:{REPLICA_ID}
    outputs:
      - direct_exchange:q4_pair_shards
    env:
      K_COUNTERS: "3"
      N_SUSPICIOUS_FILTERS: "3"

  - name: counter_q4
    strategy: counter_q4
    replicas: 3
    input: direct_exchange:q4_pair_shards:{REPLICA_ID}
    outputs:
      - direct_exchange:results
    env:
      N_PATH_FINDERS: "3"
      N_FINAL_JOINERS: "2"
      MIN_INTERMEDIATES: "5"

  - name: max_q2
    strategy: max_q2
    replicas: 3
    input: queue:q2_input
    outputs:
      - direct_exchange:q2_agg_input
    env:
      K_AGGREGATORS_Q2: "2"

  - name: bank_aggregator
    strategy: bank_aggregator
    replicas: 3
    input: queue:all_accounts
    outputs:
      - direct_exchange:q2_agg_input
    env:
      K_AGGREGATORS_Q2: "2"

  - name: aggregator_q2
    strategy: aggregator_q2
    replicas: 2
    input: direct_exchange:q2_agg_input:{REPLICA_ID}
    outputs:
      - direct_exchange:results
    env:
      EXPECTED_PARTIAL_EOFS: "6" # = N_REPLICAS de max_q2 + N_REPLICAS de bank_aggregator
      N_FINAL_JOINERS: "2"

  - name: average_local_q3
    strategy: average_local_q3
    replicas: 3
    input: queue:q3_p1_usd
    outputs:
      - direct_exchange:q3_avg_global_input
    env:
      K_AGGREGATORS_Q3: "1"

  - name: average_global_q3
    strategy: average_global_q3
    replicas: 1
    input: direct_exchange:q3_avg_global_input:0
    outputs:
      - queue:q3_filter_input
    env:
      EXPECTED_PARTIAL_EOFS: "3"   # = N_REPLICAS de average_local_q3
      N_FILTER_Q3: "1"             # = N_REPLICAS de filter_q3

  - name: filter_q3
    strategy: filter_q3
    replicas: 1
    input: queue:q3_filter_input
    outputs:
      - direct_exchange:results
    env:
      EXPECTED_PARTIAL_EOFS: "2"   # 1 de average_global_q3 + 1 de filter_currency_usd_p2 (ring initiator)
      N_FINAL_JOINERS: "2"
      BUFFER_DIR: "/tmp"

  - name: final_joiner
    strategy: final_joiner
    replicas: 2
    input: direct_exchange:results:{REPLICA_ID}
    outputs:
      - final_queue:final_1
      - final_queue:final_2
    env:
      EXPECTED_EOFS_Q1: "1"      # solo el initiator del ring de sharder_q1 emite EOF
      EXPECTED_EOFS_Q2: "1"      # aggregator_q2 está shardeado por cliente; sólo 1 emite por cliente
      EXPECTED_EOFS_Q3: "1"      # = N_REPLICAS de filter_q3
      EXPECTED_EOFS_Q4: "3"      # = K_COUNTERS (replicas de counter_q4)
