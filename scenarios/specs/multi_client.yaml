# Escenario más exigente: 2 clientes (cada uno publica el dataset completo),
# 2 gateways, y N=3 réplicas en todos los filters y en el joiner_usd (K=3).
# Mismo modelo que scaled: fan-out por queues nombradas (una por consumer-type)
# y sharding al joiner_usd vía sharded_queues:joiner_usd_input:3.

clients: 2
gateways: 2
log_level: info
transactions: /datasets/LI-Small_Trans.csv
accounts: /datasets/LI-Small_accounts.csv

workers:
  - name: filter_period1
    strategy: filter_period1
    replicas: 3
    input: queue:all_transactions
    match_count: 2
    outputs:
      - queue:period1_for_wire_ach
      - queue:period1_for_currency_usd_p1
      - queue:non_period1_transactions

  - name: filter_wire_ach
    strategy: filter_wire_ach
    replicas: 3
    input: queue:period1_for_wire_ach
    match_count: 1
    outputs:
      - queue:period1_wire_ach

  - name: filter_currency_usd_p1
    strategy: filter_currency_usd_p1
    replicas: 3
    input: queue:period1_for_currency_usd_p1
    match_count: 2
    outputs:
      - queue:period1_usd_for_drain
      - sharded_queues:joiner_usd_input:3

  - name: filter_period2
    strategy: filter_period2
    replicas: 3
    input: queue:non_period1_transactions
    match_count: 1
    outputs:
      - queue:period2_transactions
      - queue:other_dates_transactions

  - name: filter_currency_usd_p2
    strategy: filter_currency_usd_p2
    replicas: 3
    input: queue:period2_transactions
    match_count: 2
    outputs:
      - queue:period2_usd_for_drain
      - sharded_queues:joiner_usd_input:3

  - name: filter_currency_usd_other_periods
    strategy: filter_currency_usd_other_periods
    replicas: 3
    input: queue:other_dates_transactions
    match_count: 1
    outputs:
      - sharded_queues:joiner_usd_input:3

  - name: joiner_usd
    strategy: joiner_usd
    replicas: 3
    input: queue:joiner_usd_input_{REPLICA_ID}
    outputs:
      - queue:usd_for_amount_lt_50
      - queue:usd_for_drain
    env:
      EXPECTED_EOFS: "3"

  - name: filter_amount_lt_50
    strategy: filter_amount_lt_50
    replicas: 3
    input: queue:usd_for_amount_lt_50
    match_count: 1
    outputs:
      - queue:q1_input

  - name: drain_q1_input
    strategy: drain
    replicas: 1
    input: queue:q1_input
    env:
      DRAIN_OUTPUT_FILE: /results/drain_q1_input.csv
    volumes:
      - ./results:/results

  - name: drain_period1_wire_ach
    strategy: drain
    replicas: 1
    input: queue:period1_wire_ach
    env:
      DRAIN_OUTPUT_FILE: /results/drain_period1_wire_ach.csv
    volumes:
      - ./results:/results

  - name: sharder_q4
    strategy: sharder_q4
    replicas: 3
    input: queue:period1_usd_for_drain
    outputs:
      - direct_exchange:q4_account_shards
    env:
      K_PATH_FINDERS: "3"

  - name: path_finder_q4
    strategy: path_finder_q4
    replicas: 3
    input: direct_exchange:q4_account_shards:{REPLICA_ID}
    outputs:
      - direct_exchange:q4_pair_shards
    env:
      K_COUNTERS: "3"
      N_SHARDERS: "3"

  - name: counter_q4
    strategy: counter_q4
    replicas: 3
    input: direct_exchange:q4_pair_shards:{REPLICA_ID}
    outputs:
      - direct_exchange:results
    env:
      N_PATH_FINDERS: "3"
      N_FINAL_JOINERS: "1"
      MIN_INTERMEDIATES: "5"

  - name: drain_q4
    strategy: drain_q4
    replicas: 1
    input: direct_exchange:results:0
    env:
      DRAIN_OUTPUT_FILE: /results/drain_q4.csv
    volumes:
      - ./results:/results

  - name: drain_period2_usd
    strategy: drain
    replicas: 1
    input: queue:period2_usd_for_drain
    env:
      DRAIN_OUTPUT_FILE: /results/drain_period2_usd.csv
    volumes:
      - ./results:/results

  - name: drain_usd_joined
    strategy: drain
    replicas: 1
    input: queue:usd_for_drain
    env:
      DRAIN_OUTPUT_FILE: /results/drain_usd_joined.csv
    volumes:
      - ./results:/results
