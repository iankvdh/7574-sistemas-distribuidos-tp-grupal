# Spec de test enfocado SOLO en Q1.
#
# Corre el pipeline completo de filtros (period1, wire_ach, currency_usd_*, period2,
# joiner_usd, filter_amount_lt_50) y lo conecta al sharder_q1 + final_joiner_q1.
# El resto de las queries (Q2, Q3, Q4, Q5) NO tiene ningún nodo consumiendo:
# los datos que les llegarían se acumulan en sus colas previas. El cliente
# recibirá las filas + EOF de Q1; las otras 4 queries nunca cerrarán EOF, así
# que el gateway queda esperando para siempre y la sesión TCP del cliente
# tampoco se cierra. Para finalizar el escenario hay que ejecutar `make down`
# manualmente luego de inspeccionar `results/client_0/<id>_q1.csv` y
# `results/client_1/<id>_q1.csv`.
#
# Por qué este spec es útil: aísla el camino Q1 (sharder_q1 + N final_joiners)
# del resto, así un fallo en Q1 no se confunde con un fallo cualquiera de las
# otras queries. Es el espejo de multi_client.yaml pero recortado a Q1.

clients: 2
gateways: 2
log_level: info
# Sólo Q1 está activa: el gateway y el cliente esperan UN único EOF por cliente
# para cerrar la sesión (en lugar de los 5 EOFs del flujo completo).
expected_query_eofs: 1
transactions: /datasets/LI-Small_Trans.csv
accounts: /datasets/LI-Small_accounts.csv

workers:
  - name: filter_period1
    strategy: filter_period1
    replicas: 3
    input: queue:all_transactions
    match_count: 2
    outputs:
      - queue:period1_for_wire_ach
      - queue:period1_for_currency_usd_p1
      - queue:non_period1_transactions

  - name: filter_wire_ach
    strategy: filter_wire_ach
    replicas: 3
    input: queue:period1_for_wire_ach
    match_count: 1
    outputs:
      - queue:period1_wire_ach

  - name: filter_currency_usd_p1
    strategy: filter_currency_usd_p1
    replicas: 3
    input: queue:period1_for_currency_usd_p1
    match_count: 2
    outputs:
      - queue:period1_usd_for_drain
      - sharded_queues:joiner_usd_input:3

  - name: filter_period2
    strategy: filter_period2
    replicas: 3
    input: queue:non_period1_transactions
    match_count: 1
    outputs:
      - queue:period2_transactions
      - queue:other_dates_transactions

  - name: filter_currency_usd_p2
    strategy: filter_currency_usd_p2
    replicas: 3
    input: queue:period2_transactions
    match_count: 2
    outputs:
      - queue:period2_usd_for_drain
      - sharded_queues:joiner_usd_input:3

  - name: filter_currency_usd_other_periods
    strategy: filter_currency_usd_other_periods
    replicas: 3
    input: queue:other_dates_transactions
    match_count: 1
    outputs:
      - sharded_queues:joiner_usd_input:3

  - name: joiner_usd
    strategy: joiner_usd
    replicas: 3
    input: queue:joiner_usd_input_{REPLICA_ID}
    outputs:
      - queue:usd_for_amount_lt_50
      - queue:usd_for_drain
    env:
      EXPECTED_EOFS: "3"

  - name: filter_amount_lt_50
    strategy: filter_amount_lt_50
    replicas: 3
    input: queue:usd_for_amount_lt_50
    match_count: 1
    outputs:
      - queue:q1_input

  - name: sharder_q1
    strategy: sharder_q1
    replicas: 3
    input: queue:q1_input
    outputs:
      - direct_exchange:results
    env:
      N_FINAL_JOINERS: "2"

  - name: final_joiner
    strategy: final_joiner
    replicas: 2
    input: direct_exchange:results:{REPLICA_ID}
    outputs:
      - final_queue:final_1
      - final_queue:final_2
    env:
      EXPECTED_EOFS_Q1: "3"      # = N_REPLICAS de sharder_q1
