# Spec de test enfocado SOLO en Q2.
#
# Corre la pipeline mínima necesaria para Q2 — los filtros de USD (period1, period2,
# other_periods) alimentan al joiner_usd, que reenvía a queue:q2_input. De ahí
# arrancan max_q2 (anillo) + bank_aggregator (anillo, consume all_accounts) →
# aggregator_q2 (sharded por cliente) → final_joiner_q2. El resto de las queries
# (Q1, Q3, Q4, Q5) NO tiene ningún nodo consumiendo: los datos que les llegarían
# se acumulan en sus colas previas. El cliente recibirá las filas + EOF de Q2 y
# luego cerrará limpio.
#
# Por qué este spec es útil: aísla el camino Q2 (max + bank_aggregator +
# aggregator + N final_joiners) del resto, así un fallo en Q2 no se confunde con
# un fallo cualquiera de las otras queries. Es el espejo de multi_client_q1.yaml
# y multi_client_q4.yaml pero recortado a Q2.

clients: 2
gateways: 2
log_level: info
# Sólo Q2 está activa: el gateway y el cliente esperan UN único EOF por cliente
# para cerrar la sesión (en lugar de los 5 EOFs del flujo completo).
expected_query_eofs: 1
transactions: /datasets/LI-Small_Trans.csv
accounts: /datasets/LI-Small_accounts.csv

workers:
  - name: filter_period1
    strategy: filter_period1
    replicas: 3
    input: queue:all_transactions
    match_count: 1
    outputs:
      - queue:period1_for_currency_usd_p1
      - queue:non_period1_transactions

  - name: filter_currency_usd_p1
    strategy: filter_currency_usd_p1
    replicas: 3
    input: queue:period1_for_currency_usd_p1
    match_count: 1
    outputs:
      - sharded_queues:joiner_usd_input:3

  - name: filter_period2
    strategy: filter_period2
    replicas: 3
    input: queue:non_period1_transactions
    match_count: 1
    outputs:
      - queue:period2_transactions
      - queue:other_dates_transactions

  - name: filter_currency_usd_p2
    strategy: filter_currency_usd_p2
    replicas: 3
    input: queue:period2_transactions
    match_count: 1
    outputs:
      - sharded_queues:joiner_usd_input:3

  - name: filter_currency_usd_other_periods
    strategy: filter_currency_usd_other_periods
    replicas: 3
    input: queue:other_dates_transactions
    match_count: 1
    outputs:
      - sharded_queues:joiner_usd_input:3

  - name: joiner_usd
    strategy: joiner_usd
    replicas: 3
    input: queue:joiner_usd_input_{REPLICA_ID}
    outputs:
      - queue:q2_input
    env:
      EXPECTED_EOFS: "3"

  - name: max_q2
    strategy: max_q2
    replicas: 3
    input: queue:q2_input
    outputs:
      - direct_exchange:q2_agg_input
    env:
      K_AGGREGATORS_Q2: "2"

  - name: bank_aggregator
    strategy: bank_aggregator
    replicas: 3
    input: queue:all_accounts
    outputs:
      - direct_exchange:q2_agg_input
    env:
      K_AGGREGATORS_Q2: "2"

  - name: aggregator_q2
    strategy: aggregator_q2
    replicas: 2
    input: direct_exchange:q2_agg_input:{REPLICA_ID}
    outputs:
      - direct_exchange:results
    env:
      EXPECTED_PARTIAL_EOFS: "6" # = N_REPLICAS de max_q2 + N_REPLICAS de bank_aggregator
      N_FINAL_JOINERS: "2"

  - name: final_joiner
    strategy: final_joiner
    replicas: 2
    input: direct_exchange:results:{REPLICA_ID}
    outputs:
      - final_queue:final_1
      - final_queue:final_2
    env:
      EXPECTED_EOFS_Q2: "1"      # aggregator_q2 está shardeado por cliente; sólo 1 emite por cliente
