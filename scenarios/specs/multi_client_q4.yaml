# Spec de test enfocado SOLO en Q4.
#
# Corre la pipeline mínima necesaria para Q4 — filter_period1 + filter_currency_usd_p1
# producen `queue:period1_usd_for_drain`, que es la entrada de scatter_agg_q4 →
# path_finder_q4 → counter_q4 → final_joiner_q4. El resto de las queries (Q1, Q2,
# Q3, Q5) NO tiene ningún nodo consumiendo: los datos que les llegarían se acumulan
# en sus colas previas. El cliente recibirá las filas + EOF de Q4 y luego cerrará
# limpio (gracias al fix de "abort ingest cleanly on all-EOFs-received").
#
# Por qué este spec es útil: aísla el camino Q4 (scatter_agg + path_finder +
# counter + N final_joiners) del resto, así un fallo en Q4 no se confunde con un
# fallo cualquiera de las otras queries. Es el espejo de multi_client_q1.yaml
# pero recortado a Q4.

clients: 2
gateways: 2
log_level: info
# Sólo Q4 está activa: el gateway y el cliente esperan UN único EOF por cliente
# para cerrar la sesión (en lugar de los 5 EOFs del flujo completo).
expected_query_eofs: 1
transactions: /datasets/LI-Small_Trans.csv
accounts: /datasets/LI-Small_accounts.csv

workers:
  - name: filter_period1
    strategy: filter_period1
    replicas: 3
    input: queue:all_transactions
    match_count: 1
    outputs:
      - queue:period1_for_currency_usd_p1
      - queue:non_period1_transactions

  - name: filter_currency_usd_p1
    strategy: filter_currency_usd_p1
    replicas: 3
    input: queue:period1_for_currency_usd_p1
    match_count: 1
    outputs:
      - queue:period1_usd_for_drain

  - name: scatter_agg_q4
    strategy: scatter_agg_q4
    replicas: 1
    input: queue:period1_usd_for_drain
    outputs:
      - direct_exchange:q4_account_shards
    env:
      K_PATH_FINDERS: "3"
      MIN_SCATTER_DESTS: "5"

  - name: path_finder_q4
    strategy: path_finder_q4
    replicas: 3
    input: direct_exchange:q4_account_shards:{REPLICA_ID}
    outputs:
      - direct_exchange:q4_pair_shards
    env:
      K_COUNTERS: "3"
      N_SHARDERS: "1"

  - name: counter_q4
    strategy: counter_q4
    replicas: 3
    input: direct_exchange:q4_pair_shards:{REPLICA_ID}
    outputs:
      - direct_exchange:results
    env:
      N_PATH_FINDERS: "3"
      N_FINAL_JOINERS: "2"
      MIN_INTERMEDIATES: "5"

  - name: final_joiner_q4
    strategy: final_joiner
    replicas: 2
    input: direct_exchange:results:{REPLICA_ID}
    outputs:
      - final_queue:final_1
      - final_queue:final_2
    env:
      QUERY_ID: "4"
      EXPECTED_EOFS: "3"      # = K_COUNTERS (replicas de counter_q4)
