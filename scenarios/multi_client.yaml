      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - DRAIN_OUTPUT_FILE=/results/drain_period2_usd.csv
    volumes:
      - ./results:/results
  drain_usd_joined:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    environment:
      - STRATEGY=drain
      - REPLICA_ID=0
      - N_REPLICAS=1
      - INPUT=queue:usd_for_drain
      - OUTPUTS_MATCH_COUNT=0
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - DRAIN_OUTPUT_FILE=/results/drain_usd_joined.csv
    volumes:
      - ./results:/results
  rabbitmq:
    build: { context: ./src/rabbitmq, dockerfile: Dockerfile }
    environment:
