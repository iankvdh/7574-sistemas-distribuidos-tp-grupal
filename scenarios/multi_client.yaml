services:
  client_0:
    build: { context: ./src/, dockerfile: client/Dockerfile }
    depends_on:
      rabbitmq: { condition: service_healthy }
      gateway_1: { condition: service_started }
      gateway_2: { condition: service_started }
      filter_period1_0: { condition: service_started }
      filter_period1_1: { condition: service_started }
      filter_period1_2: { condition: service_started }
      filter_wire_ach_0: { condition: service_started }
      filter_wire_ach_1: { condition: service_started }
      filter_wire_ach_2: { condition: service_started }
      filter_currency_usd_p1_0: { condition: service_started }
      filter_currency_usd_p1_1: { condition: service_started }
      filter_currency_usd_p1_2: { condition: service_started }
      filter_period2_0: { condition: service_started }
      filter_period2_1: { condition: service_started }
      filter_period2_2: { condition: service_started }
      filter_currency_usd_p2_0: { condition: service_started }
      filter_currency_usd_p2_1: { condition: service_started }
      filter_currency_usd_p2_2: { condition: service_started }
      filter_currency_usd_other_periods_0: { condition: service_started }
      filter_currency_usd_other_periods_1: { condition: service_started }
      filter_currency_usd_other_periods_2: { condition: service_started }
      joiner_usd_0: { condition: service_started }
      joiner_usd_1: { condition: service_started }
      joiner_usd_2: { condition: service_started }
      filter_amount_lt_50_0: { condition: service_started }
      filter_amount_lt_50_1: { condition: service_started }
      filter_amount_lt_50_2: { condition: service_started }
      drain_q1_input: { condition: service_started }
      drain_period1_wire_ach: { condition: service_started }
      drain_period1_usd: { condition: service_started }
      drain_period2_usd: { condition: service_started }
      drain_usd_joined: { condition: service_started }
    environment:
      - INPUT_TRANSACTIONS=/datasets/LI-Small_Trans.csv
      - INPUT_ACCOUNTS=/datasets/LI-Small_accounts.csv
      - BATCH_MAX_BYTES=8192
      - GATEWAY_PREFIX=gateway_
      - GATEWAY_AMOUNT=2
      - GATEWAY_PORT=5678
      - CONNECT_MAX_ATTEMPTS=6
      - CONNECT_TIMEOUT_MS=800
      - BACKOFF_BASE_MS=200
      - BACKOFF_MAX_MS=3000
      - RESULTS_DIR=/results
    volumes:
      - ./datasets:/datasets
      - ./results/client_0:/results
