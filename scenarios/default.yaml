services:
  client_0:
    build: { context: ./src/, dockerfile: client/Dockerfile }
    depends_on:
      rabbitmq: { condition: service_healthy }
      gateway_1: { condition: service_started }
      filter_period1: { condition: service_started }
      filter_wire_ach: { condition: service_started }
      filter_currency_usd_p1: { condition: service_started }
      filter_period2: { condition: service_started }
      filter_currency_usd_p2: { condition: service_started }
      filter_currency_usd_other_periods: { condition: service_started }
      joiner_usd: { condition: service_started }
      filter_amount_lt_50: { condition: service_started }
      drain_q1_input: { condition: service_started }
      drain_period1_wire_ach: { condition: service_started }
      drain_period1_usd: { condition: service_started }
      drain_period2_usd: { condition: service_started }
      drain_usd_joined: { condition: service_started }
    environment:
      - INPUT_TRANSACTIONS=/datasets/LI-Small_Trans.csv
      - INPUT_ACCOUNTS=/datasets/LI-Small_accounts.csv
      - BATCH_MAX_BYTES=8192
      - GATEWAY_PREFIX=gateway_
      - GATEWAY_AMOUNT=1
      - GATEWAY_PORT=5678
      - CONNECT_MAX_ATTEMPTS=6
      - CONNECT_TIMEOUT_MS=800
      - BACKOFF_BASE_MS=200
      - BACKOFF_MAX_MS=3000
      - RESULTS_DIR=/results
    volumes:
      - ./datasets:/datasets
      - ./results/client_0:/results
  gateway_1:
    build: { context: ./src/, dockerfile: gateway/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - ALL_TRANSACTIONS_QUEUE=all_transactions
      - ALL_ACCOUNTS_QUEUE=all_accounts
      - FINAL_QUEUE=final
      - GATEWAY_ID=1
      - RESULT_BATCH_MAX_BYTES=8192
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=5678
  filter_period1:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=filter_period1
      - REPLICA_ID=0
      - N_REPLICAS=1
      - INPUT=queue:all_transactions
      - OUTPUTS_MATCH_COUNT=1
      - OUTPUT_0=direct_exchange:period1_transactions
      - OUTPUT_1=queue:non_period1_transactions
  filter_wire_ach:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=filter_wire_ach
      - REPLICA_ID=0
      - N_REPLICAS=1
      - INPUT=direct_exchange:period1_transactions
      - OUTPUTS_MATCH_COUNT=1
      - OUTPUT_0=queue:period1_wire_ach
  filter_currency_usd_p1:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=filter_currency_usd_p1
      - REPLICA_ID=0
      - N_REPLICAS=1
      - INPUT=direct_exchange:period1_transactions
      - OUTPUTS_MATCH_COUNT=2
      - OUTPUT_0=direct_exchange:period1_usd_direct_exchange
      - OUTPUT_1=sharded_queues:joiner_usd_input:1
  filter_period2:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=filter_period2
      - REPLICA_ID=0
      - N_REPLICAS=1
      - INPUT=queue:non_period1_transactions
      - OUTPUTS_MATCH_COUNT=1
      - OUTPUT_0=queue:period2_transactions
      - OUTPUT_1=queue:other_dates_transactions
  filter_currency_usd_p2:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=filter_currency_usd_p2
      - REPLICA_ID=0
      - N_REPLICAS=1
      - INPUT=queue:period2_transactions
      - OUTPUTS_MATCH_COUNT=2
      - OUTPUT_0=direct_exchange:period2_usd_direct_exchange
      - OUTPUT_1=sharded_queues:joiner_usd_input:1
  filter_currency_usd_other_periods:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=filter_currency_usd_other_periods
      - REPLICA_ID=0
      - N_REPLICAS=1
      - INPUT=queue:other_dates_transactions
      - OUTPUTS_MATCH_COUNT=1
      - OUTPUT_0=sharded_queues:joiner_usd_input:1
  joiner_usd:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=joiner_usd
      - REPLICA_ID=0
      - N_REPLICAS=1
      - INPUT=queue:joiner_usd_input_0
      - OUTPUTS_MATCH_COUNT=0
      - OUTPUT_0=direct_exchange:usd
      - EXPECTED_EOFS=3
  filter_amount_lt_50:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=filter_amount_lt_50
      - REPLICA_ID=0
      - N_REPLICAS=1
      - INPUT=direct_exchange:usd
      - OUTPUTS_MATCH_COUNT=1
      - OUTPUT_0=queue:q1_input
  drain_q1_input:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=drain
      - REPLICA_ID=0
      - N_REPLICAS=1
      - INPUT=queue:q1_input
      - OUTPUTS_MATCH_COUNT=0
      - DRAIN_OUTPUT_FILE=/results/drain_q1_input.csv
    volumes:
      - ./results:/results
  drain_period1_wire_ach:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=drain
      - REPLICA_ID=0
      - N_REPLICAS=1
      - INPUT=queue:period1_wire_ach
      - OUTPUTS_MATCH_COUNT=0
      - DRAIN_OUTPUT_FILE=/results/drain_period1_wire_ach.csv
    volumes:
      - ./results:/results
  drain_period1_usd:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=drain
      - REPLICA_ID=0
      - N_REPLICAS=1
      - INPUT=direct_exchange:period1_usd_direct_exchange
      - OUTPUTS_MATCH_COUNT=0
      - DRAIN_OUTPUT_FILE=/results/drain_period1_usd.csv
    volumes:
      - ./results:/results
  drain_period2_usd:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=drain
      - REPLICA_ID=0
      - N_REPLICAS=1
      - INPUT=direct_exchange:period2_usd_direct_exchange
      - OUTPUTS_MATCH_COUNT=0
      - DRAIN_OUTPUT_FILE=/results/drain_period2_usd.csv
    volumes:
      - ./results:/results
  drain_usd_joined:
    build: { context: ./src/, dockerfile: worker/Dockerfile }
    depends_on: { rabbitmq: { condition: service_healthy } }
    env_file:
      - .env
    environment:
      - STRATEGY=drain
      - REPLICA_ID=0
      - N_REPLICAS=1
      - INPUT=direct_exchange:usd
      - OUTPUTS_MATCH_COUNT=0
      - DRAIN_OUTPUT_FILE=/results/drain_usd_joined.csv
    volumes:
      - ./results:/results
  rabbitmq:
    build: { context: ./src/rabbitmq, dockerfile: Dockerfile }
    environment:
      - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
      - 5672:5672
      - 15672:15672
