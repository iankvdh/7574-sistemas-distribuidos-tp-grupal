services:
  client_0:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    depends_on:
      gateway_1:
        condition: service_started
      gateway_2:
        condition: service_started
      serial-analyzer:
        condition: service_started
    environment:
      - INPUT_TRANSACTIONS=/datasets/LI-Small_Trans.csv
      - INPUT_ACCOUNTS=/datasets/LI-Small_accounts.csv
      - BATCH_MAX_BYTES=8192
      - GATEWAY_PREFIX=gateway_
      - GATEWAY_AMOUNT=2
      - GATEWAY_PORT=5678
      - CONNECT_MAX_ATTEMPTS=6
      - CONNECT_TIMEOUT_MS=800
      - BACKOFF_BASE_MS=200
      - BACKOFF_MAX_MS=3000
      - RESULTS_DIR=/results
    volumes:
      - ./datasets:/datasets
      - ./results/client_0:/results

  client_1:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    depends_on:
      gateway_1:
        condition: service_started
      gateway_2:
        condition: service_started
      serial-analyzer:
        condition: service_started
    environment:
      - INPUT_TRANSACTIONS=/datasets/LI-Small_Trans.csv
      - INPUT_ACCOUNTS=/datasets/LI-Small_accounts.csv
      - BATCH_MAX_BYTES=8192
      - GATEWAY_PREFIX=gateway_
      - GATEWAY_AMOUNT=2
      - GATEWAY_PORT=5678
      - CONNECT_MAX_ATTEMPTS=6
      - CONNECT_TIMEOUT_MS=800
      - BACKOFF_BASE_MS=200
      - BACKOFF_MAX_MS=3000
      - RESULTS_DIR=/results
    volumes:
      - ./datasets:/datasets
      - ./results/client_1:/results

  gateway_1:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - ALL_TRANSACTIONS_QUEUE=all_transactions
      - ALL_ACCOUNTS_QUEUE=all_accounts
      - FINAL_QUEUE=final
      - GATEWAY_ID=1
      - RESULT_BATCH_MAX_BYTES=8192
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=5678

  gateway_2:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - ALL_TRANSACTIONS_QUEUE=all_transactions
      - ALL_ACCOUNTS_QUEUE=all_accounts
      - FINAL_QUEUE=final
      - GATEWAY_ID=2
      - RESULT_BATCH_MAX_BYTES=8192
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=5678

  serial-analyzer:
    build:
      context: ./src/
      dockerfile: serialanalyzer/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - ALL_TRANSACTIONS_QUEUE=all_transactions
      - ALL_ACCOUNTS_QUEUE=all_accounts
      - FINAL_QUEUE=final
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672

  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    environment:
      - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
      - 5672:5672
      - 15672:15672
